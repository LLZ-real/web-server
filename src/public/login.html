<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · Web File Server</title>
<style>
  :root {
    --bg: #0e1014;
    --panel: #16191f;
    --panel-2: #1b1f27;
    --line: #262b35;
    --fg: #e8ebf2;
    --dim: #8b93a7;
    --accent: #4c8bf5;
    --danger: #ef5b5b;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; padding: 24px 20px;
    display: flex; align-items: center; justify-content: center;
    background:
      radial-gradient(900px 420px at 50% -220px, rgba(76,139,245,.10), transparent 70%),
      var(--bg);
    color: var(--fg);
    font: 14px/1.6 ui-sans-serif, system-ui, "Segoe UI", -apple-system, "PingFang SC", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    width: min(400px, 100%); background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 28px 26px 24px;
    box-shadow: 0 24px 60px rgba(0,0,0,.35);
  }
  h1 { font-size: 20px; font-weight: 650; margin: 0 0 6px; letter-spacing: .2px; }
  h1 .dot { color: var(--accent); }
  .sub { color: var(--dim); font-size: 12.5px; margin: 0 0 22px; }
  label { display: block; color: var(--dim); font-size: 12px; margin-bottom: 7px; }
  input {
    width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--panel-2); color: var(--fg); font: inherit; font-size: 14px;
  }
  input:focus { outline: none; border-color: var(--accent); }
  button {
    width: 100%; margin-top: 16px; padding: 10px 0; border: 0; border-radius: 8px;
    background: var(--accent); color: #fff; font: inherit; font-size: 14px; font-weight: 500;
    cursor: pointer; transition: filter .15s, transform .15s;
  }
  button:hover { filter: brightness(1.08); }
  button:active { transform: scale(.99); }
  .err {
    margin: 0 0 14px; padding: 9px 12px; border-radius: 8px; font-size: 12.5px;
    background: rgba(239,91,91,.12); border: 1px solid rgba(239,91,91,.28); color: var(--danger);
  }
  .err:empty { display: none; }
  .roles {
    margin: 22px 0 0; padding-top: 16px; border-top: 1px solid var(--line);
    display: grid; gap: 6px; font-size: 12px; color: var(--dim);
  }
  .roles b { color: var(--fg); font-weight: 600; }
</style>
</head>
<body>
<div class="card">
  <h1>Web File Server<span class="dot">.</span></h1>
  <p class="sub">输入访问码进入。不同访问码对应不同权限。</p>

  <!--ERROR-->

  <form method="post" action="/login">
    <label for="code">访问码</label>
    <input id="code" name="code" type="password" autocomplete="current-password"
           placeholder="请输入访问码" required autofocus>
    <button type="submit">进入</button>
  </form>

  <div class="roles">
    <div><b>访客</b> 浏览与下载</div>
    <div><b>建设者</b> 上传文件、新建文件夹</div>
    <div><b>管理员</b> 上传、删除、查看请求监视器</div>
  </div>
</div>
</body>
</html>
