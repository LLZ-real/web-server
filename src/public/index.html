<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Web File Server</title>
<style>
  :root { --bg: #0f1115; --panel: #171a21; --line: #262b35; --fg: #e6e9ef; --dim: #8b93a7; --accent: #4c8bf5; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px; background: var(--bg); color: var(--fg);
         font: 14px/1.6 ui-sans-serif, system-ui, "Segoe UI", sans-serif; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--dim); margin: 0 0 20px; font-size: 13px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
          padding: 16px; margin-bottom: 20px; }
  #dropzone { border: 1px dashed var(--line); border-radius: 8px; padding: 28px;
              text-align: center; color: var(--dim); cursor: pointer; transition: .15s; }
  #dropzone.hot { border-color: var(--accent); color: var(--fg); background: #1b2130; }
  #dropzone strong { color: var(--fg); }
  #pick { margin-top: 10px; background: var(--accent); color: #fff; border: 0;
          padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; }
  progress { width: 100%; height: 8px; margin-top: 14px; display: none; }
  progress.on { display: block; }
  #status { color: var(--dim); font-size: 12px; margin-top: 8px; min-height: 18px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); }
  th { color: var(--dim); font-weight: 500; font-size: 12px; }
  td.name { word-break: break-all; }
  td.size, td.time, td.op { color: var(--dim); white-space: nowrap; }
  td.op a { color: var(--accent); text-decoration: none; }
  td.op a:hover { text-decoration: underline; }
  td.empty { color: var(--dim); text-align: center; padding: 28px 0; }
  video { width: 100%; max-height: 420px; background: #000; border-radius: 8px; }
  .hint { color: var(--dim); font-size: 12px; margin: 8px 0 0; }
  @media (max-width: 560px) { th:nth-child(2), td:nth-child(2),
                              th:nth-child(3), td:nth-child(3) { display: none; } }
</style>
</head>
<body>
  <h1>Web File Server</h1>
  <p class="sub">零第三方依赖 · HTTP/1.1 · Range 断点续传 · ETag 条件缓存</p>

  <div class="card">
    <div id="dropzone">
      拖拽文件到此处上传，或
      <div><button id="pick" type="button">选择文件</button></div>
      <input id="input" type="file" multiple hidden>
    </div>
    <progress id="bar" value="0" max="100"></progress>
    <div id="status"></div>
  </div>

  <div class="card">
    <table id="list">
      <thead>
        <tr><th>文件名</th><th>大小</th><th>时间</th><th>操作</th></tr>
      </thead>
      <tbody>
<!--FILES-->
      </tbody>
    </table>
  </div>

  <div class="card">
<!--VIDEO-->
  </div>

<script>
function uploadAll(files) {
  var list = Array.prototype.slice.call(files);
  var i = 0;
  (function next() {
    if (i >= list.length) { location.reload(); return; }
    var file = list[i++];
    var form = new FormData();
    form.append("file", file);

    var xhr = new XMLHttpRequest();
    xhr.upload.onprogress = function (e) {
      if (e.lengthComputable) {
        bar.value = (e.loaded / e.total) * 100;
        status.textContent = "上传 " + file.name + " (" + i + "/" + list.length + ") "
          + (e.loaded / 1048576).toFixed(2) + " / " + (e.total / 1048576).toFixed(2) + " MB";
      }
    };
    xhr.onload = function () {
      if (xhr.status === 200) { next(); }
      else { status.textContent = "上传失败：" + xhr.status + " " + xhr.responseText; }
    };
    xhr.onerror = function () { status.textContent = "网络错误：" + file.name; next(); };

    xhr.open("POST", "/upload");
    bar.classList.add("on");
    xhr.send(form);
  })();
}

var dropzone = document.getElementById("dropzone");
var input = document.getElementById("input");
var bar = document.getElementById("bar");
var status = document.getElementById("status");

document.getElementById("pick").addEventListener("click", function () { input.click(); });
dropzone.addEventListener("click", function (e) {
  if (e.target === dropzone) { input.click(); }
});
input.addEventListener("change", function () { if (input.files.length) uploadAll(input.files); });

["dragenter", "dragover"].forEach(function (evt) {
  dropzone.addEventListener(evt, function (e) { e.preventDefault(); dropzone.classList.add("hot"); });
});
["dragleave", "drop"].forEach(function (evt) {
  dropzone.addEventListener(evt, function (e) { e.preventDefault(); dropzone.classList.remove("hot"); });
});
dropzone.addEventListener("drop", function (e) {
  if (e.dataTransfer.files.length) uploadAll(e.dataTransfer.files);
});
</script>
</body>
</html>
